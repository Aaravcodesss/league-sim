[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "league-sim"
version = "1.0.0"
description = "Monte Carlo football season simulator — Elo ratings + Poisson goals, vectorised with numpy."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aarav", email = "Aaravcodesss@users.noreply.github.com" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.scripts]
league-sim = "league_sim.cli:main"

[tool.setuptools]
packages = ["league_sim"]
